spring.application.name=restaurant
server.port=7001
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant
spring.datasource.username=root
spring.datasource.password=welcome
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Enable logging of the SQL queries
logging.level.org.hibernate.SQL=DEBUG

# Enable logging of the bound parameter values (Spring Boot 3.x / Hibernate 6)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: Format the SQL query to make it pretty and readable
spring.jpa.properties.hibernate.format_sql=false